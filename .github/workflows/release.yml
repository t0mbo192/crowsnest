name: Release

# Pushing a version tag is the whole release process: this builds a standalone
# crowsnest.exe and attaches it to a GitHub Release.
#
#   1. bump __version__ in crowsnest_version.py
#   2. commit, then:  git tag v1.1.0 && git push origin main --tags
#
# Linux and the Raspberry Pi do not use this artifact -- crowsnest is pure Python
# there, so a git clone plus `git pull` is the whole install and update story.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build but do not publish a release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          file_version=$(python -c "from crowsnest_version import __version__; print(__version__)")
          echo "file=$file_version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            # A tag disagreeing with the source would ship a mislabelled build,
            # and the update check would then compare the wrong number.
            if [ "$tag_version" != "$file_version" ]; then
              echo "::error::Tag v$tag_version does not match crowsnest_version.py ($file_version)"
              exit 1
            fi
          fi
          echo "Building version $file_version"

      - name: Install build tools
        run: pip install --upgrade pyinstaller maxminddb build

      # Also ship a wheel, so `pip install` works on Linux and macOS from the
      # same release rather than only from a clone.
      - name: Build wheel
        run: python -m build --wheel --outdir dist

      # The runner has no tshark, and captures are git-ignored for privacy, so
      # there is nothing here to analyse. What this can prove is that the CLI
      # imports cleanly and every subcommand is wired up.
      - name: Smoke-test before packaging
        shell: bash
        run: |
          python crowsnest.py --version
          python crowsnest.py --help > /dev/null
          for sub in live read interfaces asn update; do
            echo "checking: crowsnest $sub --help"
            python crowsnest.py "$sub" --help > /dev/null
          done
          python -c "import crowsnest, crowsnest_core, crowsnest_banner, blocking, asn_lookup, updater, crowsnest_version"
          python -m unittest discover -p "test_*.py" -v

      # A console app, not windowed: crowsnest is a terminal tool now.
      # maxminddb is imported lazily inside a function, so name it explicitly
      # rather than relying on static analysis to spot it.
      - name: Build crowsnest.exe
        run: >
          python -m PyInstaller --onefile --console --name crowsnest
          --hidden-import maxminddb
          --distpath dist --workpath build --specpath build
          crowsnest.py

      - name: Verify the binary runs
        shell: bash
        run: |
          ./dist/crowsnest.exe --version
          ./dist/crowsnest.exe --help > /dev/null
          # maxminddb is imported lazily inside a function, so static analysis
          # can miss it. If it did not get bundled, ASN names silently stop
          # working in the released binary -- assert it is really in there.
          status="$(./dist/crowsnest.exe asn 2>&1 || true)"
          echo "$status"
          if echo "$status" | grep -qi "maxminddb is not installed"; then
            echo "::error::maxminddb was not bundled into crowsnest.exe"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: crowsnest-${{ steps.version.outputs.file }}
          path: |
            dist/crowsnest.exe
            dist/*.whl
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The wheel is built above; attach it too, so Linux and macOS have
          # something to install from the release rather than only Windows.
          wheel=$(ls dist/*.whl | head -1)
          gh release create "$GITHUB_REF_NAME" \
            --title "crowsnest ${{ steps.version.outputs.file }}" \
            --generate-notes \
            "dist/crowsnest.exe#crowsnest.exe (Windows, standalone)" \
            "$wheel#$(basename "$wheel") (pip install, any platform)"
