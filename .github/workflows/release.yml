name: Release

# Pushing a version tag is the whole release process: this builds a standalone
# netwatch.exe and attaches it to a GitHub Release.
#
#   1. bump __version__ in netwatch_version.py
#   2. commit, then:  git tag v1.1.0 && git push origin main --tags
#
# Linux and the Raspberry Pi do not use this artifact -- netwatch is pure Python
# there, so a git clone plus `git pull` is the whole install and update story.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build but do not publish a release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          file_version=$(python -c "from netwatch_version import __version__; print(__version__)")
          echo "file=$file_version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            # A tag disagreeing with the source would ship a mislabelled build,
            # and the update check would then compare the wrong number.
            if [ "$tag_version" != "$file_version" ]; then
              echo "::error::Tag v$tag_version does not match netwatch_version.py ($file_version)"
              exit 1
            fi
          fi
          echo "Building version $file_version"

      - name: Install build tools
        run: pip install --upgrade pyinstaller maxminddb

      - name: Smoke-test before packaging
        shell: bash
        run: |
          python netwatch.py --version
          python netwatch.py read example_traffic.pcapng --no-names --no-color --top 3

      # A console app, not windowed: netwatch is a terminal tool now.
      # maxminddb is imported lazily inside a function, so name it explicitly
      # rather than relying on static analysis to spot it.
      - name: Build netwatch.exe
        run: >
          python -m PyInstaller --onefile --console --name netwatch
          --hidden-import maxminddb
          --distpath dist --workpath build --specpath build
          netwatch.py

      - name: Verify the binary runs
        shell: bash
        run: |
          ./dist/netwatch.exe --version
          ./dist/netwatch.exe read example_traffic.pcapng --no-names --no-color --top 3

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: netwatch-windows-${{ steps.version.outputs.file }}
          path: dist/netwatch.exe
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "netwatch ${{ steps.version.outputs.file }}" \
            --generate-notes \
            "dist/netwatch.exe#netwatch.exe (Windows, standalone)"
