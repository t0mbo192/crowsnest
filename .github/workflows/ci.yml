name: CI

# Tests run on every pull request and every push to main, on all three
# platforms crowsnest targets. Pushing a version tag additionally builds and
# publishes a release, but only once the tests have passed.
#
#   1. bump __version__ in crowsnest_version.py
#   2. commit, then:  git tag v1.1.0 && git push origin main --tags

on:
  pull_request:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build but do not publish a release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  test:
    # Linux is where crowsnest actually gets deployed and where the blocking
    # code runs, so it needs testing there and not only on the machine it
    # happens to be written on.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the optional dependency
        run: pip install --upgrade maxminddb

      # No tshark on the runners and no capture in the repo -- captures are
      # git-ignored -- so this proves the logic, the wiring and the imports,
      # not packet analysis.
      - name: Tests
        run: python -m unittest discover -p "test_*.py" -v

      - name: Every subcommand is wired up
        shell: bash
        run: |
          python crowsnest.py --version
          python crowsnest.py --help > /dev/null
          for sub in $(python crowsnest.py --help |
                       sed -n 's/^ *{\(.*\)}$/\1/p' | tr ',' ' '); do
            echo "checking: crowsnest $sub --help"
            python crowsnest.py "$sub" --help > /dev/null
          done

      - name: Modules import cleanly
        shell: bash
        run: |
          # Every module, including the ones imported lazily inside a command,
          # since those are the ones a packaging mistake silently drops.
          python - <<'PY'
          import importlib, pathlib
          for path in sorted(pathlib.Path(".").glob("*.py")):
              if path.name.startswith("test_"):
                  continue
              importlib.import_module(path.stem)
              print("  ok", path.name)
          PY

  release:
    # Only for a tag, and only once every platform above is green.
    needs: test
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          file_version=$(python -c "from crowsnest_version import __version__; print(__version__)")
          echo "file=$file_version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            # A tag disagreeing with the source would ship a mislabelled build,
            # and the update check would then compare the wrong number.
            if [ "$tag_version" != "$file_version" ]; then
              echo "::error::Tag v$tag_version does not match crowsnest_version.py ($file_version)"
              exit 1
            fi
          fi
          echo "Building version $file_version"

      - name: Install build tools
        run: pip install --upgrade pyinstaller maxminddb build

      # Ship a wheel too, so Linux and macOS have something to install from the
      # release rather than only Windows.
      - name: Build wheel
        run: python -m build --wheel --outdir dist

      # A console app, not windowed: crowsnest is a terminal tool. maxminddb is
      # imported lazily inside a function, so name it explicitly rather than
      # relying on static analysis to spot it.
      - name: Build crowsnest.exe
        run: >
          python -m PyInstaller --onefile --console --name crowsnest
          --hidden-import maxminddb
          --distpath dist --workpath build --specpath build
          crowsnest.py

      - name: Verify the binary runs
        shell: bash
        run: |
          ./dist/crowsnest.exe --version
          ./dist/crowsnest.exe --help > /dev/null
          # If maxminddb did not get bundled, ASN names silently stop working in
          # the released binary -- assert it is really in there.
          status="$(./dist/crowsnest.exe asn 2>&1 || true)"
          echo "$status"
          if echo "$status" | grep -qi "maxminddb is not installed"; then
            echo "::error::maxminddb was not bundled into crowsnest.exe"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: crowsnest-${{ steps.version.outputs.file }}
          path: |
            dist/crowsnest.exe
            dist/*.whl
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wheel=$(ls dist/*.whl | head -1)
          gh release create "$GITHUB_REF_NAME" \
            --title "crowsnest ${{ steps.version.outputs.file }}" \
            --generate-notes \
            "dist/crowsnest.exe#crowsnest.exe (Windows, standalone)" \
            "$wheel#$(basename "$wheel") (pip install, any platform)"
